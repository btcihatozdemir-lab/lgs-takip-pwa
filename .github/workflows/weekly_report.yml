name: Haftalık rapor

on:
  workflow_dispatch:
    inputs:
      ogrenci_eposta:
        description: Yalnız bu öğrencinin seçili öğretmenlerine test gönder
        required: false
        type: string

jobs:
  gonder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          npm install

      - name: Raporları gönder
        run: node scripts/send_reports.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TEST_OGRENCI_EPOSTA: ${{ inputs.ogrenci_eposta }}
